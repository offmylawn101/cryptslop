# The Petition Bee's server. Deploy with tools/wishes/deploy.cjs (it creates the database, applies
# schema.sql, sets the admin token and fills in database_id below).
name = "cryptslop-wishes"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "cryptslop-wishes"
database_id = "ade3e8f6-be86-4371-9312-77f9faa9fb30"

# Llama Guard checks each wish as it comes in (Workers AI free tier)
[ai]
binding = "AI"
